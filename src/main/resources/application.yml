spring:
  application:
    name: security-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/security_api}
    username: ${DB_USERNAME:security_api}
    password: ${DB_PASSWORD:8ib5NGmbm2BY}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    secret: ${JWT_SECRET:change-me-in-production-to-a-long-random-secret-at-least-32-bytes}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

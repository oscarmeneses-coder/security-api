services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: security_api
      POSTGRES_USER: security_api
      POSTGRES_PASSWORD: security_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_api -d security_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/security_api
      DB_USERNAME: security_api
      DB_PASSWORD: security_api
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your shell}
      JWT_ISSUER: http://localhost:8081
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:4200
    ports:
      - "8081:8081"

volumes:
  postgres_data:
